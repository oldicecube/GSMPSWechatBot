# 示例配置。真实运行时由 MaiBot 根据 config_model 生成 plugins/mai-life/config.toml。
# 不要把本地 config.toml 提交进仓库。

[plugin]
enabled = false
config_version = "1.3.0"
# 允许使用 /mai_life_* 命令的管理员。格式 platform:user_id，例如 qq:123456、webui:webui_user_xxx。
# 名单为空时任何聊天用户都不能使用命令。本地控制台操作员始终可用。
admin_user_ids = []

[generation]
time = "01:30"
timezone = "local"
model = "planner"
max_tokens = 4096
temperature = -1.0
llm_timeout_ms = 120000
generate_on_load_if_missing = true
include_persona = true
include_history = true
include_knowledge = true
extra_persona = ""
history_message_limit = 30
history_window_hours = 24
knowledge_search_limit = 5
knowledge_window_hours = 168
history_stream_ids = []

[schedule]
enabled = true
# 例: ["session:xxx", "qq:group:123", "qq:private:456", "all"]
allowed_streams = []
stream_discovery_platform = "all_platforms"
activity_count_min = 8
activity_count_max = 14
wake_time = "08:00"
sleep_time = "01:00"
recent_days = 3
recent_inject_count = 3
inject_window_minutes = 180

[share]
enabled = true
stream_profiles = []
# 填写聊天流即启用该聊天流。条数、额外提示词按该聊天流自己的配置生效。
# [[share.stream_profiles]]
# stream = "qq:private:123456"
# count_min = 2
# count_max = 4
# extra_prompt = "只聊日常小事，不要提工作。"
# [[share.stream_profiles]]
# stream = "all"
wake_planner = true
patrol_interval_seconds = 60
cooldown_seconds = 180
silence_start = "00:00"
silence_end = "07:30"
# 静默时段只限制每日自动生成的生活分享；自行创建的单次意图不受它限制。
# 到期只请求唤醒规划器，并不等于消息已发出；实际提交受巡检间隔和同流冷却影响。

[tools]
# 直接编辑工具描述；留空恢复内置默认。保存后重载插件或重启 MaiBot。
query_description = "查询自己的生活日程和当前对话的定时任务，包括自动分享、提醒和稍后继续的话题。需要了解当前活动、查看某天安排，或在修改/取消任务前获取 task_id 时使用。"
modify_description = "修改生活日程，或在当前对话安排单次提醒、分享、继续话题等定时任务。日程用 target=schedule 和 request 描述变更；任务用 target=share，支持 list/add/update/delete。新增任务填 title、intent，并在 run_at 与 delay_minutes 中二选一；修改或取消前先查询 task_id，只能操作 pending 任务。到期唤醒规划器处理，不等于消息已发送；不支持周期任务。"

# [prompts] 各提示词可在 WebUI 中整段修改。留空则使用内置默认值。
# modify_system/modify_user 只用于日程修改，结构化任务管理不调用辅助 LLM。
# 日程修改不传入统一任务；兼容占位符 {share_json} 固定为 {}（自动分享生成用途不变）。
# 占位符：{date} {weekday} {now} {timezone} {bot_nickname} {persona}
# {history} {knowledge} {yesterday_tail} {recent_days_schedule} {schedule_json} {share_json}
# {recent_schedule} {user_request} {wake_time} {sleep_time} {recent_days}
# {activity_count_min} {activity_count_max} {share_count_min} {share_count_max}
# {stream_info} {share_item} {target} {action} {silence_start} {silence_end}
